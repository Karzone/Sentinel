[project]
name = "sentinel"
version = "0.1.0"
description = "Personal investment research copilot — research output, not financial advice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dashboard = ["streamlit>=1.40", "altair>=5.4"]

[project.scripts]
sentinel = "sentinel.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:sentinel.*"]

[tool.coverage.run]
branch = true
source = ["sentinel"]
