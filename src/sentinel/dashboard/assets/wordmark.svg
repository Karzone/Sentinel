  <path d="M 16 5 A 11 11 0 0 0 16 27 Z" fill="#2a78d6"/>
  <text x="38" y="22" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="17" font-weight="650" letter-spacing="-0.2" fill="#898781">Sentinel</text>
</svg>
