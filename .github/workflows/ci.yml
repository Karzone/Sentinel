name: CI

# The whole repository is one Python package, so there is nothing to path-filter:
# every push runs the same gate. That is a deliberate simplification over the
# split this code carried when it lived inside a larger repo — filtering exists to
# stop a Python change from paying for a .NET build, and there is no .NET here.
#
# The suite is hermetic by construction: the fixture provider generates every
# price, fundamental and news item from a hash of the ticker, so there is no
# vendor key, no network call and no flake. If a test needs a key, it is the
# wrong test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never on main: every commit on the default branch needs its own verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python 3.12 --frozen --extra dashboard

      - name: Tests
        run: uv run pytest -q

      # The risk layer is the highest-consequence code here and M3 sets its bar
      # at 100% branch coverage. Enforced rather than trusted: the spec's kill
      # criteria pre-commit that a risk-layer bypass bug suspends real-money
      # usage, so an untested branch is not a gap in a report — it is a
      # suspended system.
      - name: Risk layer must stay at 100% branch coverage
        run: |
          uv run --with pytest-cov pytest -q tests/test_risk.py \
            --cov=sentinel.risk --cov-branch --cov-fail-under=100 --cov-report=term-missing

      # The hosted deploy runs in an environment NOTHING else here reproduces:
      # Community Cloud installs requirements.txt and never installs the package
      # itself, so `import sentinel` fails in any child process that does not
      # inherit an explicit PYTHONPATH. That is invisible on every development
      # machine, because an editable install makes the package importable no
      # matter what the environment says. This step is the only thing that can
      # see it, and it exists because the seeder subprocess shipped broken
      # exactly that way: the app crashed on its first boot.
      #
      # scripts/check_hosted_boot.py drives a real client SESSION rather than
      # stopping at /_stcore/health. Streamlit answers health long before it
      # executes the app script — the script runs when a browser connects — so a
      # health-only check passes against an app that throws on its first
      # visitor. The first version of this step did exactly that.
      - name: Community Cloud deploy simulation
        run: |
          set -euo pipefail
          # requirements.txt ONLY — no `uv sync`, no editable install.
          uv venv --python 3.12 /tmp/hosted
          uv pip install --python /tmp/hosted/bin/python -q -r requirements.txt

          export SENTINEL_DB=/tmp/hosted-demo.sqlite
          export SENTINEL_DASHBOARD_PASSWORD=ci-only-not-a-secret
          /tmp/hosted/bin/python -m streamlit run streamlit_app.py \
            --server.port 8599 --server.address 127.0.0.1 \
            --server.headless true --browser.gatherUsageStats false > /tmp/hosted.log 2>&1 &

          # The checker refuses to run where `sentinel` is importable, so it
          # cannot pass vacuously if this venv is ever built the wrong way.
          /tmp/hosted/bin/python scripts/check_hosted_boot.py \
            --port 8599 --db "$SENTINEL_DB" --timeout 90 \
            || { echo "--- app log ---"; cat /tmp/hosted.log; exit 1; }

          if grep -qiE "Traceback|CalledProcessError" /tmp/hosted.log; then
            echo "the app logged an exception:"; cat /tmp/hosted.log; exit 1
          fi

      # The pipeline must run end to end with no vendor keys and no network.
      # This is the check that catches wiring bugs the unit tests cannot see —
      # it is how the config attribute mismatch in pipeline.portfolio_state was
      # found in the first place.
      - name: Offline end-to-end smoke
        run: |
          cd "$(mktemp -d)"
          uv run --project "$GITHUB_WORKSPACE" sentinel init
          uv run --project "$GITHUB_WORKSPACE" sentinel ingest --universe demo --history 500
          uv run --project "$GITHUB_WORKSPACE" sentinel brief --universe demo
          uv run --project "$GITHUB_WORKSPACE" sentinel paper status
          test -s data/briefs/*.md
